$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "acal-xpath-yaml-v1.0-structure.schema.yaml"
title: "YACAL v1.0 XPath Profile structural schema"
description: >
  XPath Profile structural schema for the YAML representation of ACAL Version
  1.0. This artifact defines the XPath-specific extension shapes that may be
  composed with the YACAL core structural schema.
$comment: >
  This schema does not replace the YACAL core structural schema. It defines the
  profile-specific object shapes that composition schemas may attach to the core
  extension hooks for PolicyDefaultsType, RequestDefaultsType,
  AttributeSelectorType, EntityAttributeSelectorType, and StructuredValueType.
  XPathRequestDefaults carries only the XPath version, and a value's XPathVersion
  is optional (defaulting from the applicable XPathRequestDefaults /
  XPathPolicyDefaults).
$defs:
  NamespaceDeclarationsType:
    type: object
    propertyNames:
      anyOf:
        - const: ""
        - type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]*$"
          not:
            enum: ["xmlns", "xml"]
      $comment: >
        A namespace Prefix is an XML NCName [NAMESPACES], not an ACAL
        IdentifierType (no {ShortId} macro-substitution). The normative lexical
        space is the full NCName production - see acal-xpath-v1.0.md Section 5.2
        - which includes non-ASCII name characters. This pattern is an
        ASCII-only approximation: a portable JSON Schema 'pattern' cannot
        express the full NCName character ranges. It is a validation floor, not
        a narrowing - an instance whose prefix is a valid non-ASCII NCName is
        conformant per Section 5.2 even though it will not match here. 'xmlns'
        is never permitted as a prefix by [NAMESPACES]; 'xml' is permitted only
        when bound to its own fixed URI, and Section 5.2 already treats that
        binding as implicitly available in every representation - so neither is
        a useful key here and both are excluded. The empty string key is the
        separate, valid default-namespace declaration.
    additionalProperties:
      type: string
      format: uri-reference
    $comment: >
      Maps each namespace Prefix (the empty string denotes the default
      namespace) directly to its Name (URI), rather than an array of
      {Prefix, Name} pair-objects. A producer SHALL NOT emit a
      duplicate key; a consumer SHALL reject one. This cannot be expressed as a
      schema constraint, since a validator only sees the instance after
      parsing, by which point a duplicate key has already been resolved in an
      implementation-defined way - see acal-xpath-v1.0.md Section 5.2 for the
      normative producer/consumer requirement.

  XPathDefaultsType:
    type: object
    required:
      - XPathVersion
    properties:
      XPathVersion:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
    additionalProperties: false

  XPathPolicyDefaultsTypeTree:
    type: object
    required:
      - XPathPolicyDefaults
    properties:
      XPathPolicyDefaults:
        $ref: "#/$defs/XPathDefaultsType"
    additionalProperties: false

  XPathRequestDefaultsTypeTree:
    type: object
    required:
      - XPathRequestDefaults
    properties:
      XPathRequestDefaults:
        $ref: "#/$defs/XPathDefaultsType"
    additionalProperties: false

  XPathAttributeSelectorType:
    allOf:
      - $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/AttributeSelectorType"
      - type: object
        properties:
          ContextSelectorId:
            $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
          Namespaces:
            $ref: "#/$defs/NamespaceDeclarationsType"
        $comment: >
          Namespaces is OPTIONAL: absent (equivalently empty) means
          the Path expression needs no supplied namespace-prefix bindings - all
          its names resolve without one, or it matches namespaces via wildcards /
          namespace-uri() / URIQualifiedNames. There is no Defaults-level
          namespace table to fall back on - see acal-xpath-v1.0.md Section 5.3.3.
    unevaluatedProperties: false

  XPathEntityAttributeSelectorType:
    allOf:
      - $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/EntityAttributeSelectorType"
      - type: object
        properties:
          ContextSelectorId:
            $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
          Namespaces:
            $ref: "#/$defs/NamespaceDeclarationsType"
        $comment: >
          Namespaces is OPTIONAL: absent means the Path expression
          needs no namespace-prefix bindings. Same rule as
          XPathAttributeSelectorType - see acal-xpath-v1.0.md Section 5.3.4.
    unevaluatedProperties: false

  XPathExpressionValueType:
    type: object
    required:
      - XPathCategory
      - XPath
    properties:
      XPathVersion:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      Namespaces:
        $ref: "#/$defs/NamespaceDeclarationsType"
      XPathCategory:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      XPath:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/AttributeSelectorPathType"
    unevaluatedProperties: false
    $comment: >
      XPathVersion and Namespaces are both OPTIONAL. XPathVersion:
      in a Request or Policy a value with no local XPathVersion takes it from
      the applicable XPathRequestDefaults / XPathPolicyDefaults; a value in a
      response, or with no applicable Defaults, MUST carry XPathVersion locally
      (not expressible here). Namespaces: absent means the XPath expression
      needs no namespace-prefix bindings; there is no Defaults-level namespace
      table to fall back on. See acal-xpath-v1.0.md Section 5.3.5.

  XPathStructuredValueTypeExtension:
    type: object
    required:
      - XPathCategory
      - XPath
    properties:
      DataType:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      XPathVersion:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      Namespaces:
        $ref: "#/$defs/NamespaceDeclarationsType"
      XPathCategory:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/IdentifierType"
      XPath:
        $ref: "acal-core-yaml-v1.0-structure.schema.yaml#/$defs/AttributeSelectorPathType"
    additionalProperties: false
    $comment: >
      Composition-facing helper for the core StructuredValueType extension
      hook. The optional DataType property is permitted here so the same
      helper works in both explicit-DataType and parent-inferred contexts.
      Namespaces is optional, matching XPathExpressionValueType above (issue
      #134): absent means the XPath expression needs no namespace-prefix
      bindings, and there is no Defaults-level namespace table. XPathVersion is
      likewise optional and defaults from the applicable XPathRequestDefaults /
      XPathPolicyDefaults - but a value in a response, or with no applicable
      Defaults, MUST carry XPathVersion locally (prose-only; acal-xpath-v1.0.md
      Section 5.3.5).

  XPathPolicyDefaultsTypeExtension:
    $ref: "#/$defs/XPathPolicyDefaultsTypeTree"

  XPathRequestDefaultsTypeExtension:
    $ref: "#/$defs/XPathRequestDefaultsTypeTree"

  XPathAttributeSelectorTypeExtension:
    $ref: "#/$defs/XPathAttributeSelectorType"

  XPathEntityAttributeSelectorTypeExtension:
    $ref: "#/$defs/XPathEntityAttributeSelectorType"
